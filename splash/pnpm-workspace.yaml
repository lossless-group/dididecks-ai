# ISOLATION: pnpm stops at the nearest workspace root, so this file keeps the
# splash separate from any workspace above it. BUILD SCRIPTS: the approvals below
# live here, and --ignore-workspace skips this file, so don't pass that flag.
packages:
  - '.'

allowBuilds:
  esbuild: true
  sharp: true

# SECURITY: satori pins fflate 0.7.3 exactly (GHSA-px8p-9vwx-vf98, fixed in
# 0.7.5). Drop this once satori's own range clears it.
overrides:
  fflate: ^0.7.5
